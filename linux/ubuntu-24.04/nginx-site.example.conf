# Example Nginx virtual host. Replace example domains and certificate paths.
server {
    listen 80;
    listen [::]:80;
    server_name app.lab.example;

    # Redirect to HTTPS after a valid TLS listener/certificate is configured.
    location / {
        return 301 https://$host$request_uri;
    }
}

