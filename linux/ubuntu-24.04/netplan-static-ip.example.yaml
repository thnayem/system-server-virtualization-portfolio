# Example only: adapt interface, addresses, gateway and DNS to your lab.
# Confirm the interface name with: ip -br link
network:
  version: 2
  ethernets:
    ens160:
      dhcp4: false
      addresses:
        - 192.0.2.20/24
      routes:
        - to: default
          via: 192.0.2.1
      nameservers:
        addresses:
          - 192.0.2.53
          - 1.1.1.1
        search:
          - lab.example
